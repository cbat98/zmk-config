# Idle state after 20 secs
CONFIG_ZMK_IDLE_TIMEOUT=20000

# Deep sleep after 10 mins
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Keyboard name. MAXIMUM 15 CHARACTERS.
#
# This feeds CONFIG_BT_DEVICE_NAME, and Zephyr asserts
#   DEVICE_NAME_LEN < CONFIG_BT_DEVICE_NAME_MAX
# with the max at 16 -- so 16 characters fails the build with a bare
# "static assertion failed" from hci_core.c and no mention of the name.
# The previous value, "Charlie's Lily58", was exactly 16.
CONFIG_ZMK_KEYBOARD_NAME="Lily58"

# nice_view
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_INVERT=y
# ZMK_DISPLAY_INVERT depends on LV_USE_THEME_MONO. Without this it is silently
# ignored -- Kconfig warns "was assigned the value 'y' but got the value 'n'"
# and the build carries on, so the display simply never inverted.
CONFIG_LV_USE_THEME_MONO=y
