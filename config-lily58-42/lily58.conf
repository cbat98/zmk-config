# Idle state after 20 secs
CONFIG_ZMK_IDLE_TIMEOUT=20000

# Deep sleep after 10 mins
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Keyboard name. MAXIMUM 15 CHARACTERS -- see config-lily58/lily58.conf for why.
#
# Deliberately different from the original-layout build, so the Bluetooth name
# tells you which of the two layouts is currently flashed.
CONFIG_ZMK_KEYBOARD_NAME="Lily58 42-key"

# nice_view
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_INVERT=y
CONFIG_LV_USE_THEME_MONO=y
