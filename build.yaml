# Build matrix for config/ -- chrl-kbd v1.
#
# The other two variants have their own matrix + config directory, because ZMK
# derives the keymap filename from the SHIELD name: shield lily58_left always
# reads <config>/lily58.keymap. Two Lily58 keymaps therefore cannot live in one
# config directory. See .github/workflows/build.yml.
#
#   build.yaml            + config/            -> chrl-kbd v1
#   build-lily58.yaml     + config-lily58/     -> Lily58, original 58-key layout
#   build-lily58-42.yaml  + config-lily58-42/  -> Lily58, 42-key training layout
---
include:
  # Displays are footprinted but routed to pro-micro 0/1/2, which is not where
  # nice_view_adapter looks. Do not add it here; see config/chrl_kbd_v1.conf.
  - board: nice_nano_v2
    shield: chrl_kbd_v1_left
  - board: nice_nano_v2
    shield: chrl_kbd_v1_right
