# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # Lily58, running the 42-key training keymap.
  - board: nice_nano_v2
    shield: lily58_left nice_view_adapter nice_view
  - board: nice_nano_v2
    shield: lily58_right

  # chrl-kbd v1. Pinout is in; not yet compiled or flashed.
  #
  # Displays are footprinted but unpopulated, and the nice!view is NOT routed
  # to the pro-micro SPI pins, so "nice_view_adapter nice_view" will not work
  # here as it does for the Lily58 above. See config/chrl_kbd_v1.conf.
  - board: nice_nano_v2
    shield: chrl_kbd_v1_left
  - board: nice_nano_v2
    shield: chrl_kbd_v1_right
