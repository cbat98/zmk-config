# Idle state after 20 secs
CONFIG_ZMK_IDLE_TIMEOUT=20000

# Deep sleep after 10 mins
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# The keyboard name is set in the shield's Kconfig.defconfig ("chrl-kbd v1"),
# since it belongs to the hardware rather than to this keymap.

# No display fitted. Both halves are footprinted and routed for a nice!view on
# pro-micro pins 0/1/2 (MOSI/SCK/CS).
#
# NOTE: that is not where the stock nice_view_adapter shield expects them. The
# adapter drives &pro_micro_spi, which on the nice!nano v2 is pinned to the
# pro-micro SPI pins (14/15/16), not 0/1/2. Adding "nice_view_adapter nice_view"
# to build.yaml will therefore produce a blank screen rather than a build error.
#
# It is fixable: the nRF52840 can route SPIM to any pin, so populating a display
# means overriding the spi pinctrl in the shield overlay to point at pro-micro
# 0/1/2. That needs the pro-micro-index -> nRF P0.xx mapping from the nice!nano
# schematic. Worth settling before ordering screens.
# CONFIG_ZMK_DISPLAY=y
# CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
# CONFIG_ZMK_DISPLAY_INVERT=y

# --- TEMPORARY: USB logging for first-bringup debugging -----------------------
# Remove once the matrix is confirmed working.
#
# Prints kscan events to a USB serial console as keys are scanned, which
# separates two failures that look identical from the host's side:
#   events appear  -> the matrix reads; the problem is HID, keymap or transform
#   nothing at all -> ZMK is not seeing the GPIOs
#
# Read it with:  sudo tio /dev/ttyACM0      (or screen /dev/ttyACM0 115200)
# The device enumerates as a second interface alongside the keyboard.
CONFIG_ZMK_USB_LOGGING=y
